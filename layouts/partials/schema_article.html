{{- /*
  Enhanced Article schema for better SEO.
  Do not pipe through jsonify here: Hugo encodes values inside
  application/ld+json automatically (same pattern as PaperMod schema_json).
*/ -}}
{{- if and .IsPage (site.Params.seo.enableSchema | default true) -}}
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Article",
  "headline": {{ .Title | plainify }},
  "description": {{ with .Description | plainify }}{{ . }}{{ else }}{{ .Summary | plainify | truncate 200 }}{{ end }},
  {{- if .Params.cover.image -}}
  "image": [
    {{- if (ne .Params.cover.relative true) -}}
    {{ .Params.cover.image | absURL }}
    {{- else -}}
    {{ (path.Join .RelPermalink .Params.cover.image ) | absURL }}
    {{- end -}}
    {{- $images := partial "templates/_funcs/get-page-images" . -}}
    {{- with index $images 0 -}}
    , {{ .Permalink }}
    {{- end -}}
  ],
  {{- else -}}
    {{- $images := partial "templates/_funcs/get-page-images" . -}}
    {{- with index $images 0 -}}
  "image": {{ .Permalink }},
    {{- else -}}
      {{- with site.Params.seo.defaultImage -}}
  "image": {{ . }},
      {{- end -}}
    {{- end -}}
  {{- end -}}
  {{- if .PublishDate -}}
  "datePublished": {{ .PublishDate.Format "2006-01-02T15:04:05-07:00" }},
  {{- end -}}
  {{- if .Lastmod -}}
  "dateModified": {{ .Lastmod.Format "2006-01-02T15:04:05-07:00" }},
  {{- end -}}
  {{- with (.Params.author | default site.Params.author) -}}
  "author": {
    "@type": "Person",
    "name": {{ . }}
  },
  {{- end -}}
  "publisher": {
    "@type": "{{ site.Params.schema.publisherType | default "Organization" | title }}",
    "name": {{ site.Title }},
    "logo": {
      "@type": "ImageObject",
      "url": {{ "apple-touch-icon.png" | absURL }},
      "width": 180,
      "height": 180
    }
  },
  "mainEntityOfPage": {
    "@type": "WebPage",
    "@id": {{ .Permalink }}
  },
  {{- if .Content -}}
  "articleBody": {{ .Content | plainify | truncate 5000 }},
  {{- end -}}
  "wordCount": {{ .WordCount }},
  "inLanguage": {{ .Language.Lang | default "zh-tw" }},
  {{- $keywords := slice -}}
  {{- if .Params.keywords -}}
    {{- $keywords = .Params.keywords -}}
  {{- else if .Params.tags -}}
    {{- $keywords = .Params.tags -}}
  {{- end -}}
  {{- if $keywords -}}
  "keywords": [
    {{- range $i, $e := $keywords -}}
    {{- if $i }}, {{ end -}}
    {{ $e }}
    {{- end -}}
  ],
  {{- end -}}
  {{- if .Section -}}
  "articleSection": {{ .Section }},
  {{- end -}}
  {{- if .Params.categories -}}
  "about": [
    {{- range $i, $cat := .Params.categories -}}
    {{- if $i }}, {{ end -}}
    {
      "@type": "Thing",
      "name": {{ $cat }}
    }
    {{- end -}}
  ],
  {{- end -}}
  "url": {{ .Permalink }}
}
</script>
{{- end -}}
