[pytest]
# Pytest configuration for myblog project
# NOTE: every key below must stay inside [pytest]. Adding another [section]
# above them silently reassigns them and pytest ignores markers/addopts.
# Coverage settings live in .coveragerc (coverage.py does not read pytest.ini).

# Test discovery patterns
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test markers
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (may involve multiple components)
    slow: Slow running tests
    cloudinary: Tests that mock Cloudinary API
    ffmpeg: Tests that mock FFmpeg subprocess

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --cov
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
    # Ratchet: current total is ~46%. Raise this as coverage improves.
    --cov-fail-under=45
